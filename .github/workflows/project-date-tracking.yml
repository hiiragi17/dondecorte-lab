name: Project Date Tracking

# PRが作られた/マージされたタイミングで、リンクされているissueの
# Project (hiiragi17/projects/2) 上の「Start date」「Merged date」フィールドを更新する。
#
# 前提:
# - Project 2 に `Start date` と `Merged date` という名前のDateフィールドを作成しておくこと
# - `project` スコープを持つ Personal Access Token を `PROJECTS_TOKEN` という名前で
#   リポジトリのSecretsに登録しておくこと（GITHUB_TOKENではProjects v2を更新できない）
# - 対象のissueが Project 2 に追加されていること（Auto-addワークフローまたは手動追加）

on:
  pull_request:
    types: [opened, reopened, edited, closed]

jobs:
  update-project-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Update Start date / Merged date on linked issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const OWNER = 'hiiragi17';
            const PROJECT_NUMBER = 2;

            const pr = context.payload.pull_request;
            const isMerged = pr.merged === true;
            const isClosed = context.payload.action === 'closed';

            // closedでmergedでない場合は何もしない（単に閉じられただけ）
            if (isClosed && !isMerged) {
              core.info('PR closed without merge — skipping');
              return;
            }

            // Project情報とフィールドID取得
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2FieldCommon {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `;
            const projectData = await github.graphql(projectQuery, {
              owner: OWNER,
              number: PROJECT_NUMBER,
            });
            const project = projectData.user.projectV2;
            if (!project) {
              core.setFailed(`Project ${OWNER}/projects/${PROJECT_NUMBER} not found`);
              return;
            }
            const projectId = project.id;
            const startField = project.fields.nodes.find(f => f && f.name === 'Start date');
            const mergedField = project.fields.nodes.find(f => f && f.name === 'Merged date');
            if (!startField) {
              core.warning('Field "Start date" not found on project');
            }
            if (!mergedField) {
              core.warning('Field "Merged date" not found on project');
            }

            // PRにリンクされているissue一覧を取得
            const linkedQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) {
                      nodes {
                        id
                        number
                      }
                    }
                  }
                }
              }
            `;
            const linked = await github.graphql(linkedQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number,
            });
            const issues = linked.repository.pullRequest.closingIssuesReferences.nodes;
            if (!issues || issues.length === 0) {
              core.info('No linked issues found on PR — nothing to update');
              return;
            }

            // 各issueについてProjectItemを探し、必要なフィールドを更新
            const itemQuery = `
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 20) {
                      nodes {
                        id
                        project { id }
                        fieldValues(first: 50) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              field { ... on ProjectV2FieldCommon { id name } }
                              date
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $date: Date!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { date: $date }
                  }
                ) {
                  projectV2Item { id }
                }
              }
            `;

            const today = new Date().toISOString().slice(0, 10);

            for (const issue of issues) {
              const itemData = await github.graphql(itemQuery, { issueId: issue.id });
              const items = itemData.node.projectItems.nodes.filter(
                i => i.project.id === projectId
              );
              if (items.length === 0) {
                core.info(`Issue #${issue.number} is not on target project — skipping`);
                continue;
              }
              const item = items[0];

              // 既存のフィールド値を調べる
              const existing = {};
              for (const fv of item.fieldValues.nodes) {
                if (fv && fv.field && fv.field.name) {
                  existing[fv.field.name] = fv.date;
                }
              }

              // Start date: opened/reopened時、まだ設定されていなければ今日の日付を入れる
              if (!isClosed && startField && !existing['Start date']) {
                await github.graphql(updateMutation, {
                  projectId,
                  itemId: item.id,
                  fieldId: startField.id,
                  date: today,
                });
                core.info(`Set Start date=${today} on issue #${issue.number}`);
              }

              // Merged date: マージされたタイミングで設定
              if (isMerged && mergedField) {
                await github.graphql(updateMutation, {
                  projectId,
                  itemId: item.id,
                  fieldId: mergedField.id,
                  date: today,
                });
                core.info(`Set Merged date=${today} on issue #${issue.number}`);
              }
            }
